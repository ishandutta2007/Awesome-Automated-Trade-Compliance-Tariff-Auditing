<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -80; }
      }
      @keyframes shimmer {
        0% { stop-color: #38bdf8; }
        50% { stop-color: #c084fc; }
        100% { stop-color: #38bdf8; }
      }
      .glow-orb {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .floating-node-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-node-2 {
        animation: floatAlt 6s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8, 8;
        animation: dashFlow 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#techGrid)" />

  <!-- Animated Ambient Light Orbs (Background layer) -->
  <circle class="glow-orb" cx="150" cy="80" r="130" fill="#38bdf8" fill-opacity="0.12" filter="url(#neonGlow)" />
  <circle class="glow-orb" cx="1060" cy="180" r="150" fill="#818cf8" fill-opacity="0.12" filter="url(#neonGlow)" />
  <circle class="glow-orb" cx="600" cy="300" r="110" fill="#c084fc" fill-opacity="0.08" filter="url(#neonGlow)" />

  <!-- Dynamic World Logistics / Trade Flow Lines (Background layer) -->
  <g opacity="0.45">
    <path class="flow-line" d="M 80 290 Q 300 130, 580 210 T 1120 120" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <path class="flow-line" d="M 120 70 Q 400 240, 750 160 T 1140 280" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <path d="M 900 60 L 980 120 L 1080 80" fill="none" stroke="#334155" stroke-width="1" />
  </g>

  <!-- Interactive/Dynamic Ecosystem Chips (Side Background) -->
  <g class="floating-node-1" opacity="0.85">
    <g transform="translate(930, 48)">
      <rect width="210" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" filter="url(#softGlow)" />
      <circle cx="24" cy="21" r="5" fill="#38bdf8" />
      <text x="38" y="26" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">HS / HTS CLASSIFICATION</text>
    </g>
  </g>

  <g class="floating-node-2" opacity="0.85">
    <g transform="translate(950, 110)">
      <rect width="190" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" filter="url(#softGlow)" />
      <circle cx="24" cy="21" r="5" fill="#818cf8" />
      <text x="38" y="26" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">TARIFF &amp; DUTY ENGINE</text>
    </g>
  </g>

  <g class="floating-node-1" opacity="0.85">
    <g transform="translate(910, 172)">
      <rect width="230" height="42" rx="21" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6" filter="url(#softGlow)" />
      <circle cx="24" cy="21" r="5" fill="#c084fc" />
      <text x="38" y="26" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">SANCTIONS &amp; DPS SCREENING</text>
    </g>
  </g>

  <g class="floating-node-2" opacity="0.85">
    <g transform="translate(940, 234)">
      <rect width="200" height="42" rx="21" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.6" filter="url(#softGlow)" />
      <circle cx="24" cy="21" r="5" fill="#34d399" />
      <text x="38" y="26" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">CUSTOMS EDI &amp; DECLARATIONS</text>
    </g>
  </g>

  <!-- FOREGROUND LAYER: Title and Subtitle (Guaranteed Crisp & High-Contrast) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 52)">
      <rect width="320" height="28" rx="14" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="14" y="19" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="1.2">⚡ GLOBAL TRADE &amp; CUSTOMS AUTOMATION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="#ffffff" font-size="37" font-weight="800" letter-spacing="-0.5">
      Automated Trade Compliance
    </text>
    <text x="0" y="180" fill="url(#accentGrad)" font-size="37" font-weight="800" letter-spacing="-0.5">
      &amp; Tariff Auditing Ecosystem
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="222" fill="#94a3b8" font-size="16" font-weight="400">
      Enterprise SaaS Platforms • Open-Source Pipelines • HS Classification • Landed Cost Auditing
    </text>

    <!-- Footer Badges Row Inside Banner -->
    <g transform="translate(0, 260)">
      <rect width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" fill="#cbd5e1" font-size="11" font-weight="500">🛡️ Customs Auditing</text>

      <rect x="145" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="157" y="17" fill="#cbd5e1" font-size="11" font-weight="500">📦 HS / HTS Codes</text>

      <rect x="285" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="297" y="17" fill="#cbd5e1" font-size="11" font-weight="500">⚖️ Trade Sanctions</text>

      <rect x="430" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="442" y="17" fill="#cbd5e1" font-size="11" font-weight="500">🌐 EDI / CUSDEC</text>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.8" />
</svg>
